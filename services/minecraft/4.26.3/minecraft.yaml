---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: minecraft
  namespace: ${releaseNamespace}
spec:
  chart:
    spec:
      chart: minecraft
      sourceRef:
        kind: HelmRepository
        name: itzg.github.io-minecraft-server-charts
        namespace: ${releaseNamespace}
      version: 4.26.3
  interval: 15s
  install:
    remediation:
      retries: 30
    createNamespace: true
  upgrade:
    remediation:
      retries: 30
  releaseName: minecraft
  valuesFrom:
    - kind: ConfigMap
      name: minecraft-4.26.3-defaults
  targetNamespace: ${releaseNamespace}
